        title: { type: string }
        section_key: { type: [string, "null"] }
        section_title: { type: [string, "null"] }
        section_order: { type: [integer, "null"], minimum: 1 }
        markdown: { type: string }
        source_fingerprint:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        sync_status:
          type: string
          enum: [synced, review_required, missing]
        is_favorite: { type: boolean }
    NoteItemDocument:
      type: object
      required:
        [
          paper_id,
          note_revision,
          paper_revision,
          item_templates,
          slots,
          evidence_catalog,
          items,
          candidates,
          removals,
          warnings,
          pending_candidate_count,
        ]
      properties:
        paper_id: { type: string, format: uuid }
        note_revision: { type: integer, minimum: 0 }
        paper_revision: { type: integer, minimum: 1 }
        item_templates:
          type: array
          items: { $ref: "#/components/schemas/NoteItemTemplate" }
        slots:
          type: array
          items: { $ref: "#/components/schemas/NoteItemSlot" }
        evidence_catalog:
          type: array
          items: { $ref: "#/components/schemas/EvidenceReference" }
        items:
          type: array
          items: { $ref: "#/components/schemas/NoteItemSource" }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/NoteAnalysisCandidate" }
        removals:
          type: array
          items: { $ref: "#/components/schemas/NoteAnalysisRemoval" }
        warnings:
          type: array
          items: { type: string }
        pending_candidate_count: { type: integer, minimum: 0 }
    NoteItemTemplate:
