[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "papermatrix"
version = "0.1.0"
description = "Local-first research paper workflow backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "filelock>=3.19,<4",
  "jsonschema>=4.25,<5",
  "pydantic>=2.13,<3",
  "pypdf>=6.7,<7",
  "python-multipart>=0.0.22,<1",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.39,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-jsonschema>=4.25,<5",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/papermatrix"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["papermatrix"]

[[tool.mypy.overrides]]
module = ["yaml", "filelock"]
ignore_missing_imports = true
